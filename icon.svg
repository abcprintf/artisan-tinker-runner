<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Terminal window outline -->
  <rect x="2" y="3" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Title bar line -->
  <line x1="2" y1="7" x2="22" y2="7" stroke="currentColor" stroke-width="1.5"/>
  <!-- Traffic dots -->
  <circle cx="5" cy="5" r="0.8" fill="currentColor"/>
  <circle cx="8" cy="5" r="0.8" fill="currentColor"/>
  <circle cx="11" cy="5" r="0.8" fill="currentColor"/>
  <!-- Prompt $ -->
  <text x="4" y="14" font-family="monospace" font-size="5" fill="currentColor">$</text>
  <!-- Cursor block -->
  <rect x="7.5" y="10.5" width="3" height="4.5" rx="0.5" fill="currentColor"/>
  <!-- Magic wand -->
  <line x1="17" y1="10" x2="21" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="17,10 15.5,13 18.5,11.5" fill="currentColor"/>
  <!-- Sparkle dots -->
  <circle cx="20" cy="9" r="0.6" fill="currentColor"/>
  <circle cx="18" cy="7" r="0.6" fill="currentColor"/>
</svg>
