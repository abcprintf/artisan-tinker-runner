<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Terminal window body -->
  <rect x="14" y="30" width="100" height="72" rx="8" fill="url(#terminal)" opacity="0.9"/>

  <!-- Title bar -->
  <rect x="14" y="30" width="100" height="18" rx="8" fill="#0a1628"/>
  <rect x="14" y="40" width="100" height="8" fill="#0a1628"/>

  <!-- Traffic lights -->
  <circle cx="27" cy="39" r="4" fill="#e74c3c"/>
  <circle cx="40" cy="39" r="4" fill="#f39c12"/>
  <circle cx="53" cy="39" r="4" fill="#2ecc71"/>

  <!-- Line 1: shell prompt -->
  <text x="22" y="64" font-family="monospace" font-size="9" fill="#e74c3c" filter="url(#glow)">$</text>
  <text x="30" y="64" font-family="monospace" font-size="9" fill="#a8d8ea">php artisan tinker</text>

  <!-- Line 2: PHP expression -->
  <text x="22" y="76" font-family="monospace" font-size="8" fill="#89d185">&gt;&gt;&gt;</text>
  <text x="36" y="76" font-family="monospace" font-size="8" fill="#9cdcfe">User</text>
  <text x="59" y="76" font-family="monospace" font-size="8" fill="#d4d4d4">::</text>
  <text x="67" y="76" font-family="monospace" font-size="8" fill="#dcdcaa">count</text>
  <text x="92" y="76" font-family="monospace" font-size="8" fill="#d4d4d4">()</text>

  <!-- Line 3: result -->
  <text x="22" y="88" font-family="monospace" font-size="9" fill="#b5cea8">= 42</text>

  <!-- Blinking cursor -->
  <rect x="22" y="96" width="6" height="9" rx="1" fill="#e74c3c" opacity="0.9"/>

  <!-- Magic wand -->
  <g transform="translate(92, 8) rotate(45)">
    <rect x="0" y="0" width="5" height="22" rx="2.5" fill="url(#accent)"/>
    <polygon points="2.5,-4 5,2 0,2" fill="#f39c12"/>
  </g>

  <!-- Sparkles -->
  <circle cx="106" cy="16" r="2"   fill="#f39c12" opacity="0.9"/>
  <circle cx="114" cy="23" r="1.5" fill="#ff6b35" opacity="0.7"/>
  <circle cx="110" cy="10" r="1"   fill="#ffffff"  opacity="0.6"/>
</svg>
